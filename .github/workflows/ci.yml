name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lua-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.10.0, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p .deps/ripgrep
          cd .deps/ripgrep
          apt-get download ripgrep
          dpkg -x ripgrep_*.deb .
          echo "$PWD/usr/bin" >> "$GITHUB_PATH"
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew list ripgrep || brew install ripgrep
      - name: Clone plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .deps/plenary.nvim
      - name: Run Lua tests
        run: make test-lua
      - name: Install lazy.nvim for installation smoke test
        run: git clone --depth 1 --branch stable https://github.com/folke/lazy.nvim .deps/lazy.nvim
      - name: Test installation
        run: make test-install
      - name: Install pinned Obsidian renderer for interaction tests
        if: matrix.os == 'ubuntu-latest' && matrix.neovim == 'stable'
        uses: actions/checkout@v4
        with:
          repository: obsidian-nvim/obsidian.nvim
          ref: 7a2b7caf41de196de66f27c1969d0d429810621a
          path: .deps/obsidian.nvim
      - name: Test real Obsidian checkbox rendering
        if: matrix.os == 'ubuntu-latest' && matrix.neovim == 'stable'
        env:
          TASKBUFFER_TEST_OBSIDIAN: ${{ github.workspace }}/.deps/obsidian.nvim
        run: python3 scripts/test-lua.py tests/interaction_spec.lua
      - name: Install pinned Telescope for demo playback
        if: matrix.os == 'ubuntu-latest' && matrix.neovim == 'stable'
        uses: actions/checkout@v4
        with:
          repository: nvim-telescope/telescope.nvim
          ref: 40aedd8a68c78a656a10a8d62d80c54af59420fb
          path: .deps/telescope.nvim
      - name: Verify demo playback and OBS recording protocol
        if: matrix.os == 'ubuntu-latest' && matrix.neovim == 'stable'
        run: make demo-check DEMO_ARGS='--deps .deps'

  lua-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ tests/ scripts/demo/
      - name: Install selene
        run: cargo install selene
      - name: Run selene
        run: selene lua/
